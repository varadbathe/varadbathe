name: Generate Contribution Heatmap

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Heatmap SVG
        run: python generate_heatmap.py

      - name: Commit and Push Heatmap SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update animated contribution heatmap [skip ci]"
          file_pattern: "contribution-heatmap.svg"
